<html lang='en'>
  <head>
    <title>CS4241 Assignment 3</title>
    <meta charset='utf-8' />
    <script src='form.js'></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <main>
    <h1>Assignment Tracker</h1>
    <a href="/logout" class = "btn btn-primary">logout</a>
    <div id = "myForm">
      <div class="row">
      <div class="col-12 col-md-6 col-lg-4">
      <div class = "card">
      <label class="form-label" for="yourname" id="labels">What's your name? </label>
      <input type='text' class="form-control" id='yourname'>
      <br>
      <br>
      <label class="form-label" for="assignment" id="labels">Assignment Type: </label>
      <select class="form-select" name="assignment-type" id="assignmenttype">
        <option value="">--Please choose an option--</option>
        <option value="hw">hw</option>
        <option value="quiz">quiz</option>
        <option value="test">test</option>
        <option value="project">project</option>
      </select>
      <br>
      <br>
      <label class="form-label" for="gradeletter">Letter Grade: </label>
      <select class="form-select" name="grade-letter" id="gradeletter">
        <option value="">--Please choose an option--</option>
        <option value="a">a</option>
        <option value="b">b</option>
        <option value="c">c</option>
        <option value="d">d</option>
      </select>
      <br>
      <br>
      <label class="form-label" for="cmts" >Any comments? </label>
      <textarea class="form-control" id="cmts" name="comments"></textarea>
      <br>
      <br>
      <input class = "btn btn-primary" id = "submitButton" type="button" value = "submit" onclick="handleSubmit(event)">
    </div>
    </div>
    </div>
  </div>
</main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
