    <form id = myForm>
      <div class="row">
        <div class="col-12 col-md-6 col-lg-4">
      <div class = "card">

      <input type='text' id='yourname'>
      <br>
      <br>
      <label class = "card-body" for="assignment" id="labels">Assignment Type: </label>
      <select name="assignment-type" id="assignmenttype">

        <option value="hw">hw</option>
        <option value="quiz">quiz</option>
        <option value="test">test</option>
        <option value="project">project</option>
      </select>
      <br>
      <br>
      <label class = "card-body" for="grade" id="labels">Letter Grade: </label>

        <option value="b">b</option>
        <option value="c">c</option>
        <option value="d">d</option>
      </select>
      <br>
      <br>
      <label class = "card-body" for="cmts" id="labels">Any comments? </label>
      <textarea id="cmts" name="comments"></textarea>
      <br>
      <br>
      <input class = "btn btn-primary" type="button" value = "submit">
    </div>
    </div>
    </div>
